name: Compilar Mod NeoForge 26.3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Buscar y Compilar Mod NeoForge (.jar)
        run: |
          MOD_DIR=$(find . -name "build.gradle" -printf "%h\n" | head -n 1)
          echo "Compilando en: $MOD_DIR"
          cd "$MOD_DIR" && gradle build

      - name: Subir archivo JAR listo
        uses: actions/upload-artifact@v4
        with:
          name: inventario-infinito-neoforge-26.3
          path: "**/build/libs/*.jar"
